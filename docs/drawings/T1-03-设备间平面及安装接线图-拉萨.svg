<text x="40" y="196" font-size="3.2" text-anchor="start" font-weight="bold">安装接线说明：</text>
<text x="40" y="202" font-size="2.6" text-anchor="start">1) 设备编号与 T1-01 一致（B1-B5/INV1/DB/F1-F6/QF1/QF2）；</text>
<text x="40" y="207" font-size="2.6" text-anchor="start">2) 直流(电池柜-逆变器) 70mm² ≤2m；交流(逆变器-配电箱) 6mm²；</text>
<text x="40" y="212" font-size="2.6" text-anchor="start">3) 交/直流线缆分桥架敷设；等电位联结 + PE 接地；</text>
<text x="40" y="217" font-size="2.6" text-anchor="start">4) 电池柜垫高 ≥100mm；设备间机械通风、干燥、防积水；</text>
<text x="40" y="222" font-size="2.6" text-anchor="start">5) 尺寸与检修距离按 W8 布置定案，消防/警示齐全；</text>
<text x="40" y="227" font-size="2.6" text-anchor="start">    设备间保温（≥10℃）：极端 -16.5℃，防蓄电池低温容量损失；</text>
<text x="40" y="232" font-size="2.6" text-anchor="start">    进风百叶冬季可关闭，必要时加低温加热器</text>
