<text x="40" y="200" font-size="2.8" text-anchor="start" fill="black" font-weight="bold">安装接线说明：</text>
<text x="40" y="206" font-size="2.3" text-anchor="start" fill="black">1) 设备编号与 T1-01 一致（B1-B5/INV1/DB/F1-F6/QF1/QF2）；</text>
<text x="40" y="211" font-size="2.3" text-anchor="start" fill="black">2) 直流(电池柜-逆变器) RV70mm² ≤2m；交流(逆变-配电) RVV6mm²；充电 RV16mm²；</text>
<text x="40" y="216" font-size="2.3" text-anchor="start" fill="black">3) 交/直流分桥架；等电位联结+PE 接地（≥6mm²）；接地电阻≤4Ω；</text>
<text x="40" y="221" font-size="2.3" text-anchor="start" fill="black">4) 电池柜垫高≥100mm；保温≥10℃（墙体/门+电伴热，低温充电必需）；</text>
<text x="40" y="226" font-size="2.3" text-anchor="start" fill="black">5) 通风与保温平衡（排风扇加保温风阀）；消防/警示齐全。</text>
