<text x="45" y="205" font-size="4" class="t" font-weight="bold">安装接线说明：</text>
<text x="45" y="211" font-size="3.2">1. 设备编号与 T1-01 一致（B1-B5/INV1/DB/F1-F6/QF1/QF2）；</text>
<text x="45" y="215.5" font-size="3.2">2. 直流（电池柜-逆变器）RV 70mm² ≤2m；交流（逆变器-配电箱）RVV 6mm²；</text>
<text x="45" y="220.0" font-size="3.2">3. 交/直流线缆分桥架敷设；等电位联结 + PE 接地（≤4Ω）；</text>
<text x="45" y="224.5" font-size="3.2">4. 电池柜垫高≥100mm；机械通风、干燥、防积水；</text>
<text x="45" y="229.0" font-size="3.2">5. 保温+加热（≥10℃）为硬性前提：极端 -38.1℃，防冻禁充；</text>
<text x="45" y="233.5" font-size="3.2">    双逆变器并排壁挂（间隔≥0.2m 散热），两路交直流分槽</text>
